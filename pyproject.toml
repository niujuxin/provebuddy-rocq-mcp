[project]
name = "provebuddy-rocq-mcp"
version = "0.1.0"
description = "Rocq/Coq proof engine (engine layer only; no MCP server yet)"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9",
    "pytanque @ git+https://github.com/LLM4Rocq/pytanque@v0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "black>=24.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "utils*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
